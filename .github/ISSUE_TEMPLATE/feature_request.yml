name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, [Discussions](https://github.com/pournasserian/mcp-my-site/discussions) is the better place. Use this form when you have a concrete proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead. A setting, a command, an endpoint, a behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use now.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits "one site per server, sites under 1,000 pages"
        - label: I am willing to open a pull request for this
