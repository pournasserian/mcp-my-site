name: Release NuGet package

on:
  push:
    tags: ['v*.*.*']
  # A manual run publishes an existing tag again (first publish of a release, or a NuGet.org
  # hiccup). The tag is an input so the run works from any branch; it names the package version.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

# NuGet.org trusts this workflow through a Trusted Publishing policy (owner tajan, repository
# pournasserian/mcp-my-site, file release-nuget.yml): the job presents GitHub's OIDC token and gets
# a one-hour API key back, so there is no long-lived NuGet key to store or rotate. The id-token
# permission is what lets the job request that token; the GitHub token itself stays read-only.
permissions:
  contents: read
  id-token: write

# Two runs for the same tag would race to push the same package, so they queue instead.
concurrency:
  group: release-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The package version is the tag without its leading v, so v1.2.3 publishes mcpmysite 1.2.3.
      # It is passed to every dotnet call so the assembly and the package carry the same version.
      - name: Version from tag
        id: version
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore McpMySite.slnx

      - name: Build
        run: dotnet build McpMySite.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/McpMySite.Tests --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack src/McpMySite.Indexer --configuration Release --no-build --output nupkg -p:Version=${{ steps.version.outputs.version }}

      # The user is the nuget.org profile name that owns the policy, not an email address. The key
      # it returns is valid for an hour, which is why the login sits right before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: tajan

      # --skip-duplicate makes a rerun of an already published version a no-op instead of a failure.
      - name: Push to NuGet.org
        run: dotnet nuget push nupkg/mcpmysite.${{ steps.version.outputs.version }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
