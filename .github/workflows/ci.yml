name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# The workflow only builds and tests, so the token is read-only and no secrets are needed.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on master always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: it is where the project is developed, and
        # it is case-insensitive, so it exposes path and ignore-file mistakes that Linux hides.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore McpMySite.slnx

      - name: Build
        run: dotnet build McpMySite.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/McpMySite.Tests --configuration Release --no-build

      # The release workflow packs the indexer for NuGet.org; packing here catches a broken package
      # (a missing README, bad metadata) on the pull request instead of on the tag.
      - name: Pack
        run: dotnet pack src/McpMySite.Indexer --configuration Release --no-build --output nupkg

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --file src/McpMySite.Server/Dockerfile --tag mcp-my-site:ci .

      # server.json is the project's entry in the MCP registry. The registry proves ownership of the
      # image by the io.modelcontextprotocol.server.name label, so the label must equal the name in
      # the manifest, and the manifest's version and image tag must follow the release version.
      - name: Check registry manifest
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          name=$(jq -r .name server.json)
          label=$(docker inspect mcp-my-site:ci --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}')
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          echo "name=$name label=$label version=$version"
          [ "$label" = "$name" ]
          [ "$(jq -r .version server.json)" = "$version" ]
          [ "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/pournasserian/mcp-my-site:$version" ]

      # The release publishes an arm64 image too; cross-compiling it here catches a Dockerfile
      # change that only breaks that platform. Nothing is loaded or run, so no emulation is needed.
      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 --file src/McpMySite.Server/Dockerfile .

      # With no index configured the server must still start and report that it has none (503).
      - name: Smoke test
        run: |
          docker run --detach --name smoke --publish 8080:8080 mcp-my-site:ci
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/healthz || true)
            [ "$status" = "503" ] && break
            sleep 1
          done
          echo "healthz status: $status"
          docker logs smoke
          docker rm --force smoke
          [ "$status" = "503" ]

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The project has one author. Commits and PR descriptions must not credit an AI tool.
      - name: Reject AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt)|generated with.*(claude|copilot|chatgpt)'
          if git log --format='%H %s%n%b' "$BASE..$HEAD" | grep -i -E "$pattern"; then
            echo "::error::A commit message carries AI attribution. Amend it before merging."
            exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -i -q -E "$pattern"; then
            echo "::error::The pull request description carries AI attribution. Edit it before merging."
            exit 1
          fi
