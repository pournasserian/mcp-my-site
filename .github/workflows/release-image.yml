name: Release image

on:
  push:
    tags: ['v*.*.*']
  # Manual runs must be started from a tag (Actions tab > Use workflow from > Tags); from a branch
  # there is no version to derive the image tags from and the push step fails.
  workflow_dispatch:

# Pushing to the repository's own GHCR package is the only write the workflow needs.
permissions:
  contents: read
  packages: write

# Two runs for the same tag would race to push the same image tags, so they queue instead.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From tag v1.2.3: 1.2.3, 1.2 and latest (latest is added automatically for non-prerelease
      # semver tags). The OCI source label is what links the package to this repository on GHCR.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 only: .NET does not build reliably under QEMU, and the Dockerfile compiles inside the
      # container, so arm64 needs either a native arm64 runner or a cross-compiling Dockerfile.
      # Provenance is off because the attestation shows up as an extra "unknown/unknown" entry on
      # the package page.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/McpMySite.Server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
