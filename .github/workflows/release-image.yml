name: Release image

on:
  push:
    tags: ['v*.*.*']
  # A manual run publishes an existing tag again (first publish of a release, or a registry hiccup).
  # The tag is an input so the run works from any branch; without it there is no version to name
  # the image after and the push step fails.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

# Pushing to the repository's own GHCR package is the only write the workflow needs.
permissions:
  contents: read
  packages: write

# Two runs for the same tag would race to push the same image tags, so they queue instead.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From tag v1.2.3: 1.2.3, 1.2 and latest (latest is added automatically for non-prerelease
      # semver tags). The OCI source label is what links the package to this repository on GHCR.
      # The git context reads the tag and commit from the checkout above, so a manual run labels
      # the image with the release commit rather than the branch it was started from.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Both architectures come out of one amd64 run: the Dockerfile compiles on the build platform
      # and the SDK cross-compiles for the target, so no QEMU emulation of .NET is needed (only the
      # runtime image is pulled per platform, which needs no emulation to assemble).
      # Provenance is off because the attestation shows up as an extra "unknown/unknown" entry on
      # the package page.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/McpMySite.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
